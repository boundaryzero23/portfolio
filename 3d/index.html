<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    html,
    body {
      height: 100%;
    }

    canvas {
      display: block;
    }

    @media screen and (max-width:1180px) {
      #canvas3d {
        width: 0;
        height: 0;
        visibility: hidden;
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <canvas id="canvas3d"></canvas>

  <script>
    // ============================================================
    // iframe 위에서 굴린 휠을 부모 페이지 스크롤로 전달
    // ------------------------------------------------------------
    // 부모 페이지는 .wrap 이 height:100vh; overflow:hidden 으로
    // 잠겨 있다가, main.js 가 body의 휠 이벤트를 감지해
    // .wrap 에 active 를 붙여야 비로소 스크롤이 풀린다.
    //
    // 그런데 마우스가 이 iframe 위에 있으면 휠 이벤트가 부모 body 까지
    // 전달되지 않아 .wrap 이 계속 잠긴 상태로 남는다.
    // → 그래서 여기서 부모의 .wrap 잠금을 직접 풀어주고 스크롤도 넘긴다.
    //
    // Spline 런타임이 canvas에서 stopPropagation() 을 호출할 수 있으므로
    // capture 단계로 등록해 먼저 이벤트를 받는다.
    // ============================================================
    (function () {
      function forwardWheelToParent(e) {
        try {
          if (!window.parent || window.parent === window) return;

          var parentDoc = window.parent.document;
          var wrap = parentDoc.querySelector('.wrap');

          // 부모 페이지의 스크롤 잠금 해제 (main.js 의 동작과 동일)
          // 아래로 내릴 때만 푼다. 위로 올릴 때도 붙이면 최상단으로
          // 되돌아왔을 때 스크롤바가 사라지지 않는다.
          if (wrap && e.deltaY > 0 && !wrap.classList.contains('active')) {
            wrap.classList.add('active');
          }

          // 실제 스크롤 이동량 전달
          window.parent.scrollBy({
            top: e.deltaY,
            left: e.deltaX,
            behavior: 'auto'
          });
        } catch (err) {
          console.warn('부모 페이지 스크롤 전달 실패:', err);
        }
      }

      window.addEventListener('wheel', forwardWheelToParent, {
        capture: true,
        passive: true
      });

      document.addEventListener('wheel', forwardWheelToParent, {
        capture: true,
        passive: true
      });
    })();
  </script>

  <script type="module">
    import { Application } from './runtime.js';
    const canvas = document.getElementById('canvas3d');
    const app = new Application(canvas);
    app.load('./scene.splinecode');
  </script>
</body>

</html>
